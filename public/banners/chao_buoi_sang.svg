<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#3d280c"/>
      <stop offset="45%" stop-color="#1e1408"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </radialGradient>

    <!-- Sun Ring Glow Gradient -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD200" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF8C00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Ambient Radial Glow -->
    <radialGradient id="sunCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAE00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF6600" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Text Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1920" height="1080" fill="url(#bgGlow)"/>

  <!-- Sun & Clock Geometric Rings System -->
  <g transform="translate(680, 520)">
    <!-- Central ambient light -->
    <circle r="520" fill="url(#sunCenter)" filter="url(#glow)"/>

    <!-- Concentric graphic rings representing morning sun & dial -->
    <circle r="460" fill="none" stroke="url(#ringGrad1)" stroke-width="2.5" stroke-dasharray="8 14" opacity="0.45"/>
    <circle r="390" fill="none" stroke="url(#ringGrad2)" stroke-width="4" opacity="0.55"/>
    <circle r="320" fill="none" stroke="url(#ringGrad1)" stroke-width="1.5" opacity="0.3"/>
    <circle r="250" fill="none" stroke="#FFA726" stroke-width="5" opacity="0.6" stroke-dasharray="160 30 90 20"/>
    <circle r="180" fill="none" stroke="url(#ringGrad2)" stroke-width="3" opacity="0.5"/>
    <circle r="110" fill="none" stroke="#FFD54F" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>

    <!-- Dynamic arc curves like broadcast graphics -->
    <path d="M -420,0 A 420 420 0 0 1 0,-420" fill="none" stroke="#FFCA28" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <path d="M 0,380 A 380 380 0 0 1 380,0" fill="none" stroke="#FF7043" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
    <path d="M -300,-150 A 335 335 0 0 1 150,-300" fill="none" stroke="#FFE082" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Left Side Vignette / Contrast Layer for text readability -->
  <rect width="1100" height="1080" fill="url(#sunCenter)" opacity="0.4"/>

  <!-- VTV1 Logo Top-Left -->
  <g transform="translate(130, 110)">
    <!-- VTV emblem -->
    <g transform="scale(1.2)">
      <!-- V (Red) -->
      <polygon points="0,0 26,0 16,36 3,36" fill="#DA251D"/>
      <polygon points="8,8 19,8 28,36 18,36" fill="#DA251D"/>
      <!-- T (Green) -->
      <polygon points="34,0 60,0 52,36 41,36" fill="#009245"/>
      <polygon points="28,0 48,0 44,10 32,10" fill="#009245"/>
      <!-- V (Blue) -->
      <polygon points="68,0 94,0 84,36 71,36" fill="#0054A6"/>
      <!-- 1 -->
      <text x="110" y="32" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" font-style="italic">1</text>
    </g>
  </g>

  <!-- Main Broadcast Show Title: CHÀO BUỔI SÁNG -->
  <g transform="translate(130, 480)" filter="url(#shadow)">
    <!-- Background watermark glow text -->
    <text x="0" y="80" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="120" fill="rgba(255, 215, 0, 0.08)" letter-spacing="4">
      CHÀO BUỔI SÁNG
    </text>

    <!-- Main Title -->
    <text x="0" y="80" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="900" font-size="112" fill="#FFFFFF" letter-spacing="2">
      CHÀO BUỔI SÁNG
    </text>

    <!-- Slogan / Subtitle -->
    <text x="6" y="150" font-family="'Inter', -apple-system, system-ui, sans-serif" font-weight="600" font-size="34" fill="#FFCA28" letter-spacing="6">
      KHỞI ĐẦU NGÀY MỚI CÙNG VTV1
    </text>
  </g>

  <!-- 06:00 Time Capsule Badge Bottom-Left -->
  <g transform="translate(130, 880)">
    <rect width="210" height="74" rx="20" fill="rgba(0, 0, 0, 0.65)" stroke="rgba(255, 215, 0, 0.4)" stroke-width="2"/>
    <circle cx="48" cy="37" r="14" fill="none" stroke="#FFCA28" stroke-width="3"/>
    <line x1="48" y1="37" x2="48" y2="28" stroke="#FFCA28" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="48" y1="37" x2="54" y2="37" stroke="#FFCA28" stroke-width="2.5" stroke-linecap="round"/>
    <text x="76" y="47" font-family="'Inter', -apple-system, system-ui, monospace, sans-serif" font-weight="800" font-size="32" fill="#FFFFFF" letter-spacing="2">
      06:00
    </text>
  </g>
</svg>
