<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('waves_system_settings');
          var fontScaleMap = ['0.78', '0.88', '1', '1.12', '1.24'];
          var scaleIdx = 2; // Default: Trung bình (1)
          if (saved) {
            var parsed = JSON.parse(saved);
            if (typeof parsed.fontScale === 'number') {
              scaleIdx = parsed.fontScale;
              if (parsed.fontScaleVersion !== 2) {
                if (scaleIdx === 1) scaleIdx = 2;
                else if (scaleIdx === 0) scaleIdx = 1;
                else if (scaleIdx === 2) scaleIdx = 3;
                else if (scaleIdx === 3) scaleIdx = 4;
                else scaleIdx = 2;
              }
            }
          }
          var scaleVal = fontScaleMap[scaleIdx] || '1';
          document.documentElement.style.setProperty('--waves-font-scale', scaleVal);

          // Spatial Glass on by default
          if (saved) {
            try {
              var s = JSON.parse(saved);
              if (s.spatialGlassVersion === 2 && s.spatialGlass === false) {
                document.documentElement.classList.add('no-spatial-glass', 'no-shiny-outline');
              } else {
                document.documentElement.classList.remove('no-spatial-glass', 'no-shiny-outline');
              }
            } catch(e) {
              document.documentElement.classList.remove('no-spatial-glass', 'no-shiny-outline');
            }
          } else {
            document.documentElement.classList.remove('no-spatial-glass', 'no-shiny-outline');
          }

          // Default to light mode (user preference: light mode là mode mặc định)
          var theme = 'light';
          if (saved) {
            try {
              var ts = JSON.parse(saved);
              if (ts.theme === 'dark') {
                theme = 'dark';
              }
            } catch(e) {}
          }
          if (theme === 'light') {
            document.documentElement.classList.add('light-mode');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.remove('light-mode');
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('light-mode');
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <title>VNRT Online</title>
    <meta name="description" content="Nền tảng cộng đồng dành cho những người yêu thích, theo dõi và lưu trữ nội dung về truyền hình Việt Nam với giao diện streaming hiện đại." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alata&display=swap" rel="stylesheet">

    <meta property="og:title" content="VNRT Online" />
