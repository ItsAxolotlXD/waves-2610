<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('waves_system_settings');
          var fontScaleMap = ['0.78', '0.88', '1', '1.12', '1.24'];
          var scaleIdx = 2; // Default: Trung bình (1)
          if (saved) {
            var parsed = JSON.parse(saved);
            if (typeof parsed.fontScale === 'number') {
              scaleIdx = parsed.fontScale;
              if (parsed.fontScaleVersion !== 2) {
                if (scaleIdx === 1) scaleIdx = 2;
                else if (scaleIdx === 0) scaleIdx = 1;
                else if (scaleIdx === 2) scaleIdx = 3;
                else if (scaleIdx === 3) scaleIdx = 4;
                else scaleIdx = 2;
              }
            }
          }
          var scaleVal = fontScaleMap[scaleIdx] || '1';
          document.documentElement.style.setProperty('--waves-font-scale', scaleVal);

          // Fluent Design on by default (shiny outline and heavy spatial glass removed)
          document.documentElement.classList.add('no-shiny-outline', 'fluent-design');
          if (saved) {
            try {
              var s = JSON.parse(saved);
              var isAcrylicActive = s.spatialGlass !== false;
              var acrylicOpacity = typeof s.spatialGlassOpacity === 'number' ? s.spatialGlassOpacity : 20;
              if (isAcrylicActive && acrylicOpacity < 40) {
                document.documentElement.classList.add('spatial-glass-under-40');
              } else {
                document.documentElement.classList.remove('spatial-glass-under-40');
              }
              if (isAcrylicActive && acrylicOpacity > 40) {
                document.documentElement.classList.add('spatial-glass-dark-content');
              } else {
                document.documentElement.classList.remove('spatial-glass-dark-content');
              }
            } catch(e) {}
          }

          // Default to dark mode (user preference: dark mode là chế độ giao diện mặc định)
          var theme = 'dark';
          if (saved) {
            try {
              var ts = JSON.parse(saved);
              if (ts.themeVersion === 2) {
                if (ts.theme === 'light') theme = 'light';
                else theme = 'dark';
              } else {
                theme = 'dark';
              }
            } catch(e) {}
          }
          if (theme === 'light') {
            document.documentElement.classList.add('light-mode');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.remove('light-mode');
            document.documentElement.classList.add('dark');
          }
        } catch(e) {
          document.documentElement.classList.remove('light-mode');
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Vplay</title>
    <meta name="description" content="Nền tảng cộng đồng dành cho những người yêu thích, theo dõi và lưu trữ nội dung về truyền hình Việt Nam với giao diện streaming hiện đại." />
